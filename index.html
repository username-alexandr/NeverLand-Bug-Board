<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b0b14" />
  <title>NeverLand — Bug Board</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <style>
    :root{
      --bg:#090912;--panel:#11111d;--panel2:#161627;--line:#2a2940;--text:#f5f2ff;--muted:#a9a5bd;
      --violet:#9d5cff;--pink:#ff5fba;--cyan:#57e6db;--green:#72e6a0;--yellow:#ffd166;--red:#ff6f7d;
      --shadow:0 18px 50px rgba(0,0,0,.32);--r:20px
    }
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 15% -10%,rgba(157,92,255,.18),transparent 30%),radial-gradient(circle at 90% 0,rgba(87,230,219,.12),transparent 27%),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
    button,input,select,textarea{font:inherit}.wrap{width:min(1200px,calc(100% - 28px));margin:auto}.top{padding:28px 0 18px;display:flex;gap:18px;justify-content:space-between;align-items:flex-start}.brand{display:flex;gap:13px;align-items:center}.logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(145deg,var(--violet),var(--pink) 56%,var(--cyan));box-shadow:0 0 32px rgba(157,92,255,.28);display:grid;place-items:center;font-weight:900;color:#fff;letter-spacing:-2px}.brand h1{font-size:24px;margin:0}.brand p{color:var(--muted);margin:3px 0 0}.top-actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid var(--line);background:#171727;color:var(--text);border-radius:12px;padding:10px 14px;cursor:pointer;transition:.18s}.btn:hover{transform:translateY(-1px);border-color:#4b486d}.btn.primary{background:linear-gradient(135deg,var(--violet),#7e47e6);border-color:transparent;font-weight:750}.btn.ghost{background:transparent}.btn.ok{background:rgba(114,230,160,.12);border-color:rgba(114,230,160,.35);color:#b9f6cc}.btn.warn{background:rgba(255,209,102,.1);border-color:rgba(255,209,102,.3);color:#ffe49e}.btn.danger{background:rgba(255,111,125,.1);border-color:rgba(255,111,125,.3);color:#ffb0b8}.demo{display:none;margin:0 0 14px;padding:11px 14px;border:1px solid rgba(255,209,102,.3);background:rgba(255,209,102,.08);border-radius:13px;color:#ffe5a7}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:6px 0 15px}.stat{background:linear-gradient(180deg,rgba(255,255,255,.025),transparent),var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.stat .n{font-size:26px;font-weight:850;line-height:1}.stat .t{color:var(--muted);margin-top:7px;font-size:13px}.tools{display:grid;grid-template-columns:1.8fr repeat(3,1fr);gap:10px;background:var(--panel);border:1px solid var(--line);padding:12px;border-radius:16px;margin-bottom:15px}.field,.tools input,.tools select{width:100%;background:#0e0e19;border:1px solid var(--line);color:var(--text);border-radius:11px;padding:10px 11px;outline:none}.field:focus,.tools input:focus,.tools select:focus{border-color:#6f5baa;box-shadow:0 0 0 3px rgba(157,92,255,.1)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;padding-bottom:40px}.card{background:linear-gradient(180deg,rgba(255,255,255,.028),transparent 42%),var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:17px;display:flex;flex-direction:column;min-height:245px;box-shadow:0 12px 34px rgba(0,0,0,.13)}.card:hover{border-color:#403d5c}.meta{display:flex;align-items:center;justify-content:space-between;gap:8px}.ticket{font-weight:800;color:#c9baff;font-size:12px;letter-spacing:.04em}.date{color:#77748b;font-size:12px}.card h3{font-size:17px;line-height:1.25;margin:10px 0 7px}.desc{color:#bdb9ca;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;margin:0 0 13px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}.chip{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:#c9c5d5;background:#0e0e18}.chip.critical{border-color:rgba(255,111,125,.4);color:#ff9ca6}.chip.high{border-color:rgba(255,209,102,.38);color:#ffe08e}.chip.fixed{border-color:rgba(114,230,160,.38);color:#a9efbf}.chip.in_progress{border-color:rgba(87,230,219,.35);color:#9cf4ec}.chip.confirmed{border-color:rgba(157,92,255,.4);color:#c9b2ff}.adminbar{display:none;gap:7px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:13px;padding-top:12px}.adminbar.show{display:flex}.empty{text-align:center;color:var(--muted);padding:55px 10px;grid-column:1/-1}.modal{position:fixed;inset:0;background:rgba(2,2,8,.72);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.open{display:flex}.dialog{width:min(760px,100%);max-height:92vh;overflow:auto;background:#0f0f1a;border:1px solid #302d46;border-radius:22px;box-shadow:var(--shadow);padding:20px}.dialog.small{width:min(430px,100%)}.dialog-head{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:15px}.dialog h2{margin:0;font-size:21px}.x{background:transparent;border:0;color:var(--muted);font-size:26px;cursor:pointer}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{grid-column:1/-1}label{display:block;color:#c7c3d3;font-size:12px;margin:0 0 5px}.dialog textarea{min-height:108px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}.detail-section{padding:12px 0;border-top:1px solid var(--line)}.detail-section:first-of-type{border-top:0}.detail-section b{display:block;margin-bottom:4px}.toast{position:fixed;right:18px;bottom:18px;max-width:360px;padding:12px 14px;border-radius:12px;background:#191928;border:1px solid var(--line);box-shadow:var(--shadow);display:none;z-index:30}.toast.show{display:block}.admin-state{display:none;color:#a8efc0;font-size:12px;padding:10px 0}.admin-state.show{display:block}
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.tools{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}}
    @media(max-width:620px){.top{flex-direction:column}.top-actions{justify-content:flex-start}.grid{grid-template-columns:1fr}.tools{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.brand h1{font-size:21px}}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand"><div class="logo">NL</div><div><h1>NeverLand Bug Board</h1><p>Баги, статусы и прогресс исправлений проекта</p></div></div>
      <div class="top-actions"><button class="btn ghost" id="adminBtn">Админ</button><button class="btn primary" id="reportBtn">+ Сообщить о баге</button></div>
    </header>
    <div class="demo" id="demoBanner">Демо-режим: база Supabase ещё не подключена. Интерфейс работает на тестовых данных.</div>
    <div class="admin-state" id="adminState">● Админ-режим активен — доступно изменение статусов.</div>
    <section class="stats">
      <div class="stat"><div class="n" id="sOpen">0</div><div class="t">Открыто</div></div>
      <div class="stat"><div class="n" id="sWork">0</div><div class="t">В работе</div></div>
      <div class="stat"><div class="n" id="sCritical">0</div><div class="t">Критичных открыто</div></div>
      <div class="stat"><div class="n" id="sFixed">0</div><div class="t">Исправлено</div></div>
    </section>
    <section class="tools">
      <input id="search" placeholder="Поиск по багам…" />
      <select id="statusFilter"><option value="">Все статусы</option><option value="new">Новый</option><option value="confirmed">Подтверждён</option><option value="in_progress">В работе</option><option value="fixed">Исправлен</option><option value="wontfix">Отклонён</option></select>
      <select id="categoryFilter"><option value="">Все модули</option><option>Minecraft</option><option>Launcher</option><option>Website</option><option>Telegram Bot</option><option>Design</option><option>Other</option></select>
      <select id="severityFilter"><option value="">Любая важность</option><option value="critical">Критическая</option><option value="high">Высокая</option><option value="medium">Средняя</option><option value="low">Низкая</option></select>
    </section>
    <main class="grid" id="grid"></main>
  </div>

  <div class="modal" id="reportModal"><div class="dialog">
    <div class="dialog-head"><h2>Сообщить о баге</h2><button class="x" data-close="reportModal">×</button></div>
    <form id="bugForm">
      <div class="formgrid">
        <div class="full"><label>Краткое название *</label><input class="field" name="title" maxlength="120" required placeholder="Например: не начисляются очки за мобов во время нашествия" /></div>
        <div><label>Модуль *</label><select class="field" name="category" required><option>Minecraft</option><option>Launcher</option><option>Website</option><option>Telegram Bot</option><option>Design</option><option>Other</option></select></div>
        <div><label>Важность *</label><select class="field" name="severity" required><option value="medium">Средняя</option><option value="low">Низкая</option><option value="high">Высокая</option><option value="critical">Критическая</option></select></div>
        <div><label>Версия / сервер</label><input class="field" name="version" maxlength="80" placeholder="Например: Purpur 26.2 / Towny Addons 0.4.0" /></div>
        <div><label>Ваш ник</label><input class="field" name="reporter_name" maxlength="60" placeholder="Необязательно" /></div>
        <div class="full"><label>Что произошло? *</label><textarea class="field" name="description" maxlength="4000" required placeholder="Опишите проблему и где она проявляется"></textarea></div>
        <div class="full"><label>Шаги для воспроизведения</label><textarea class="field" name="steps" maxlength="4000" placeholder="1. Открыть…\n2. Нажать…\n3. Получить ошибку…"></textarea></div>
        <div><label>Ожидаемый результат</label><textarea class="field" name="expected" maxlength="2000"></textarea></div>
        <div><label>Фактический результат</label><textarea class="field" name="actual" maxlength="2000"></textarea></div>
      </div>
      <div class="actions"><button type="button" class="btn" data-close="reportModal">Отмена</button><button class="btn primary" type="submit">Отправить баг</button></div>
    </form>
  </div></div>

  <div class="modal" id="adminModal"><div class="dialog small">
    <div class="dialog-head"><h2>Вход администратора</h2><button class="x" data-close="adminModal">×</button></div>
    <form id="loginForm"><label>Email</label><input class="field" name="email" type="email" required autocomplete="username" /><div style="height:10px"></div><label>Пароль</label><input class="field" name="password" type="password" required autocomplete="current-password" /><div class="actions"><button class="btn" type="button" data-close="adminModal">Отмена</button><button class="btn primary" type="submit">Войти</button></div></form>
  </div></div>

  <div class="modal" id="detailModal"><div class="dialog"><div class="dialog-head"><h2 id="detailTitle"></h2><button class="x" data-close="detailModal">×</button></div><div id="detailBody"></div></div></div>
  <div class="toast" id="toast"></div>

<script>
const cfg=window.NEVERLAND_BUGS_CONFIG||{};
const configured=cfg.supabaseUrl && cfg.supabaseAnonKey && !cfg.supabaseUrl.includes('YOUR_');
const sb=configured?supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey):null;
let bugs=[]; let session=null; let isAdmin=false;
const demo=[
 {id:'d1',ticket_no:12,created_at:new Date(Date.now()-86400000).toISOString(),title:'Не начисляются очки за мобов во время нашествия',description:'После убийства мобов счётчик нашествия не увеличивается.',category:'Minecraft',severity:'critical',status:'in_progress',reporter_name:'Тестер',version:'26.2',steps:'Запустить нашествие и убить моба.',expected:'Очки добавляются.',actual:'Счётчик не меняется.'},
 {id:'d2',ticket_no:11,created_at:new Date(Date.now()-172800000).toISOString(),title:'Координаты экспедиции выводятся тегом',description:'В сообщении старта экспедиции виден плейсхолдер вместо числовых координат.',category:'Minecraft',severity:'high',status:'confirmed',reporter_name:'Игрок',version:'Towny Expeditions',steps:'Начать экспедицию.',expected:'Показаны X/Y/Z.',actual:'Показывается тег координат.'},
 {id:'d3',ticket_no:10,created_at:new Date(Date.now()-259200000).toISOString(),title:'Английские названия блоков в меню',description:'Часть строительных ресурсов отображается на английском языке.',category:'Minecraft',severity:'medium',status:'fixed',reporter_name:'',version:'Towny Builds',steps:'Открыть меню строительства.',expected:'Русские локализованные названия.',actual:'Часть названий на английском.'}
];
const els=id=>document.getElementById(id);
const statusLabel={new:'Новый',confirmed:'Подтверждён',in_progress:'В работе',fixed:'Исправлен',wontfix:'Отклонён'};
const severityLabel={critical:'Критическая',high:'Высокая',medium:'Средняя',low:'Низкая'};
function toast(msg){const t=els('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800)}
function ticket(b){return 'NL-'+String(b.ticket_no||0).padStart(4,'0')}
function esc(s=''){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function render(){
 const q=els('search').value.trim().toLowerCase(), st=els('statusFilter').value, cat=els('categoryFilter').value, sev=els('severityFilter').value;
 const list=bugs.filter(b=>(!q||[b.title,b.description,b.version,b.reporter_name,ticket(b)].some(x=>(x||'').toLowerCase().includes(q)))&&(!st||b.status===st)&&(!cat||b.category===cat)&&(!sev||b.severity===sev));
 const open=bugs.filter(b=>!['fixed','wontfix'].includes(b.status)).length;
 els('sOpen').textContent=open; els('sWork').textContent=bugs.filter(b=>b.status==='in_progress').length; els('sCritical').textContent=bugs.filter(b=>b.severity==='critical'&&!['fixed','wontfix'].includes(b.status)).length; els('sFixed').textContent=bugs.filter(b=>b.status==='fixed').length;
 els('grid').innerHTML=list.length?list.map(b=>`<article class="card" data-id="${b.id}"><div class="meta"><span class="ticket">${ticket(b)}</span><span class="date">${new Date(b.created_at).toLocaleDateString('ru-RU')}</span></div><h3>${esc(b.title)}</h3><p class="desc">${esc(b.description)}</p><div class="chips"><span class="chip ${b.status}">${statusLabel[b.status]||b.status}</span><span class="chip ${b.severity}">${severityLabel[b.severity]||b.severity}</span><span class="chip">${esc(b.category)}</span></div><div class="adminbar ${isAdmin?'show':''}"><button class="btn" data-status="confirmed">Подтвердить</button><button class="btn warn" data-status="in_progress">В работу</button><button class="btn ok" data-status="fixed">Исправлено</button><button class="btn danger" data-status="wontfix">Отклонить</button></div></article>`).join(''):'<div class="empty">По заданным фильтрам багов не найдено.</div>';
 document.querySelectorAll('.card').forEach(c=>{c.addEventListener('click',e=>{if(e.target.dataset.status)return;showDetail(c.dataset.id)});c.querySelectorAll('[data-status]').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();setStatus(c.dataset.id,btn.dataset.status)}))});
}
function showDetail(id){const b=bugs.find(x=>x.id===id); if(!b)return; els('detailTitle').textContent=`${ticket(b)} · ${b.title}`; const row=(name,val)=>val?`<div class="detail-section"><b>${name}</b><div>${esc(val).replace(/\n/g,'<br>')}</div></div>`:''; els('detailBody').innerHTML=`<div class="chips" style="margin-bottom:12px"><span class="chip ${b.status}">${statusLabel[b.status]}</span><span class="chip ${b.severity}">${severityLabel[b.severity]}</span><span class="chip">${esc(b.category)}</span></div>${row('Описание',b.description)}${row('Шаги воспроизведения',b.steps)}${row('Ожидалось',b.expected)}${row('Получено',b.actual)}${row('Версия / сервер',b.version)}${row('Автор отчёта',b.reporter_name)}`;openModal('detailModal')}
async function load(){if(!configured){bugs=[...demo];els('demoBanner').style.display='block';render();return} const {data,error}=await sb.from('bugs').select('*').order('created_at',{ascending:false}); if(error){toast('Не удалось загрузить баги: '+error.message);return} bugs=data||[];render()}
async function setStatus(id,status){if(!session||!isAdmin)return toast('Нужны права администратора'); if(!configured)return toast('В демо-режиме статусы не сохраняются'); const patch={status}; if(status==='fixed')patch.fixed_at=new Date().toISOString(); const {error}=await sb.from('bugs').update(patch).eq('id',id); if(error)return toast('Ошибка: '+error.message); toast('Статус обновлён');await load()}
function openModal(id){els(id).classList.add('open')} function closeModal(id){els(id).classList.remove('open')}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close)); document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open')}));
els('reportBtn').onclick=()=>openModal('reportModal'); els('adminBtn').onclick=async()=>{if(session){if(configured)await sb.auth.signOut();session=null;isAdmin=false;els('adminState').classList.remove('show');els('adminBtn').textContent='Админ';render();return}openModal('adminModal')};
['search','statusFilter','categoryFilter','severityFilter'].forEach(id=>els(id).addEventListener(id==='search'?'input':'change',render));
els('bugForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const payload=Object.fromEntries(f.entries());payload.status='new';if(!configured){toast('Подключите Supabase, чтобы сохранять новые баги');return}const {error}=await sb.from('bugs').insert(payload);if(error)return toast('Ошибка отправки: '+error.message);e.target.reset();closeModal('reportModal');toast('Баг отправлен. Спасибо!');await load()});
async function verifyAdmin(){if(!session){isAdmin=false;return false}const {data,error}=await sb.from('admins').select('user_id').eq('user_id',session.user.id).maybeSingle();isAdmin=!error&&!!data;return isAdmin}
els('loginForm').addEventListener('submit',async e=>{e.preventDefault();if(!configured)return toast('Сначала подключите Supabase');const f=new FormData(e.target);const {data,error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error)return toast('Ошибка входа: '+error.message);session=data.session;if(!await verifyAdmin()){await sb.auth.signOut();session=null;isAdmin=false;return toast('У этого аккаунта нет прав администратора')}closeModal('adminModal');els('adminState').classList.add('show');els('adminBtn').textContent='Выйти';toast('Админ-режим включён');render()});
(async()=>{if(configured){const {data}=await sb.auth.getSession();session=data.session;if(session&&await verifyAdmin()){els('adminState').classList.add('show');els('adminBtn').textContent='Выйти'}else if(session){await sb.auth.signOut();session=null;isAdmin=false}sb.channel('bugs-live').on('postgres_changes',{event:'*',schema:'public',table:'bugs'},()=>load()).subscribe()}await load()})();
</script>
</body>
</html>
